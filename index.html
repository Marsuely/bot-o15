<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curiosidades sobre tecnologia</title>

  <style>
    body {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #f0f5ff;
      color: #222;
    }

    h1 {
      color: #174ea6;
    }

    .mensagem {
      min-height: 70px;
      padding: 15px;
      background-color: white;
      border-radius: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background-color: #174ea6;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d3475;
    }
  </style>
</head>
<body>
  <h1>Curiosidades sobre tecnologia</h1>

  <p>
    A tecnologia está presente no nosso dia a dia: usamos computadores e celulares
    para estudar, trabalhar, conversar e descobrir novas informações.
  </p>

  <p class="mensagem">
    Clique no botão para conhecer uma curiosidade!
  </p>

  <button class="botao">Mostrar curiosidade</button>

  <script>
    const botao = document.querySelector(".botao");
    const mensagem = document.querySelector(".mensagem");

    const curiosidades = [
      "O primeiro mouse de computador foi criado em 1964 e era feito de madeira.",
      "O primeiro domínio registrado na internet foi symbolics.com, em 1985.",
      "A palavra “robô” vem de uma palavra tcheca que significa “trabalho forçado”.",
      "O e-mail foi criado antes da World Wide Web.",
      "O primeiro celular portátil comercial foi lançado em 1983 e pesava cerca de 1 kg.",
      "O código QR foi criado no Japão, em 1994, para acompanhar peças de automóveis.",
      "Existem mais combinações possíveis em um jogo de xadrez do que átomos no universo observável."
    ];

    let indice = 0;

    function mostrarMensagem() {
      mensagem.textContent = curiosidades[indice];
      mensagem.style.backgroundColor = "#d9ead3";

      indice++;

      if (indice === curiosidades.length) {
        indice = 0;
      }
    }

    botao.addEventListener("click", mostrarMensagem);
  </script>
</body>
</html>
